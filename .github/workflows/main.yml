
      - name: Installare Android SDK
        shell: bash
        run: |
          SDK_MANAGER="$(find /usr/local/lib/android/sdk "$HOME" -type f -path '*/cmdline-tools/*/bin/sdkmanager' -print -quit 2>/dev/null || true)"

          if [ -z "$SDK_MANAGER" ]; then
            echo "::error::Android SDK Manager non trovato"
            exit 1
          fi

          echo "SDK Manager: $SDK_MANAGER"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"
