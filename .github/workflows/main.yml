
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Scaricare progetto
        uses: actions/checkout@v5

      - name: Configurare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installare Android SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configurare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilare APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Salvare APK
        uses: actions/upload-artifact@v4
        with:
          name: Un_paso_a_la_vez_Simone_v4_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
