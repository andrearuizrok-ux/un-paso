
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  apk:
    name: Compilazione APK Simone
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Scaricare il progetto
        uses: actions/checkout@v5

      - name: Configurare Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Configurare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificare ambiente Android
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          gradle --version

      - name: Compilare APK Debug
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verificare APK generato
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Salvare APK scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: Un_paso_a_la_vez_Simone_v4_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
