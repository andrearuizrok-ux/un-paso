plugins {
    id 'com.android.application'
}
android {
    namespace 'com.unpaso.alavez'
    compileSdk 35
    defaultConfig {
        applicationId 'com.unpaso.alavez'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '5.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
