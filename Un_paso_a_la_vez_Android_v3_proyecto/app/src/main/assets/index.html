const td=()=>{const d=new Date;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function today(){return td()}
function dateStr(s){try{return new Date(s+'T12:00:00').toLocaleDateString(state.lang==='es'?'es-ES':'it-IT',{day:'numeric',month:'short'})}catch(e){return s}}
function niceDate(){return new Date().toLocaleDateString(state.lang==='es'?'es-ES':'it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function id(){return 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return defaultData();const p=JSON.parse(raw);if(!p || !Array.isArray(p.tasks)||!Array.isArray(p.moods)||!Array.isArray(p.thoughts))throw Error('bad');const d={...defaultData(),...p};if(!['es','it'].includes(d.lang))d.lang='es';d.journals=Array.isArray(d.journals)?d.journals:[];d.journalDraft=d.journalDraft&&typeof d.journalDraft==='object'&&!Array.isArray(d.journalDraft)?d.journalDraft:{};return d}catch(e){return defaultData()}}

ass="section-title">${esc(t('thoughtTitle'))}</h2><p class="small">${esc(t('thoughtIntro'))}</p><div class="thought-example"><div class="small strong">${esc(t('sampleLabel'))}</div><p class="small"><strong>${esc(t('sampleBefore'))}:</strong> ${esc(t('thoughtSample'))}</p><p class="small"><strong>${esc(t('sampleAfter'))}:</strong> ${esc(t('thoughtSampleFair'))}</p></div><form id="thought-form"><div class="field"><label for="thoughtBad">${esc(t('thoughtBad'))}</label><textarea name="before" id="thoughtBad" class="input" placeholder="${esc(t('thoughtBadPlaceholder'))}" maxlength="1000" required></textarea></div><div class="field"><label for="thoughtFair">${esc(t('thoughtFair'))}</label><textarea name="after" id="thoughtFair" class="input" placeholder="${esc(t('thoughtFairPlaceholder'))}" maxlength="1000" required></textarea></div><button class="btn" type="submit">${esc(t('saveThought'))}</button></form></section><section class="card"><h2 class="section-title">${esc(t('thoughtHistory'))}</h2>${recentThoughts.length?recentThoughts.map(x=>`<div><span class="tiny muted">${esc(dateStr(x.date))}</span><p class="small"><strong>${esc(t('sampleBefore'))}:</strong> ${esc(x.before)}</p><p class="small"><strong>${esc(t('sampleAfter'))}:</strong> ${esc(x.after)}</p><hr class="divider"></div>`).join(''):`<p class="small muted">${esc(t('thoughtEmpty'))}</p>`}</section></div>`}

function journalRecap(j){return [j.situation&&[t('journalMoment'),j.situation],j.thought&&[t('journalMost'),j.thought],j.support&&[t('journalEvidence'),j.support],j.against&&[t('journalAlternative'),j.against],j.mistake&&[t('journalMistakeRecap'),j.mistake],j.balanced&&[t('journalReply'),j.balanced],j.positive&&[t('journalGood'),j.positive],j.learning&&[t('journalLearned'),j.learning],j.next&&[t('journalDo'),j.next]].filter(Boolean).map(([k,v])=>`<div class="journal-recap"><strong>${esc(k)}</strong><div>${esc(v)}</div></div>`).join('')}
function journalSupportivePrompt(j){const q=String(j.thought||'').toLocaleLowerCase();let key=({autoestima:'journalHelpSelf',trabajo:'journalHelpWork',casa:'journalHelpHouse',relacion:'journalHelpLove'}[j.topic]||'journalHelpOther');if(/(no s[eé] hacer nada|non so fare niente|non sono capace|soy un fracaso|sono un fallito|no sirvo)/i.test(q))key='journalHelpSelf';return t(key)}

function saveJournal(form){const f=new FormData(form);const data={topic:String(f.get('topic')||'otro'),emotion:String(f.get('emotion')||'otro'),trap:String(f.get('trap')||'ninguno'),intensity:Math.min(5,Math.max(1,Number(f.get('intensity')||3))) };for(const name of journalFields)data[name]=String(f.get(name)||'').trim().slice(0,2500);if(![data.situation,data.thought,data.positive,data.learning,data.mistake,data.balanced].some(Boolean)){showToast(t('journalEmptyError'));return}if(!journalAreas.includes(data.topic))data.topic='otro';if(!journalEmotions.includes(data.emotion))data.emotion='otro';if(!thinkingTraps.includes(data.trap))data.trap='ninguno';const old=state.journals.find(j=>j.id===journalEditId);if(old){Object.assign(old,data,{updatedAt:new Date().toISOString()});reviewId=old.id}else{const newRecord={...data,id:id(),date:today(),createdAt:new Date().toISOString()};state.journals.push(newRecord);reviewId=newRecord.id}const wasEdit=!!old;if(!wasEdit)state.journalDraft={};journalEditId=null;helpText='';persist();render();showToast(t(wasEdit?'journalUpdated':'journalSaved'));document.getElementById('journal-result')?.scrollIntoView({block:'start',behavior:'smooth'})}
function helpThought(){const thought=String(document.getElementById('j-thought')?.value||'').trim();const topic=document.getElementById('j-topic')?.value||'otro';const trap=document.getElementById('j-trap')?.value||'ninguno';const lower=thought.toLocaleLowerCase();if(!thought){helpText=t('journalNoThought')}else{let key=topic==='autoestima'?'journalHelpSelf':topic==='trabajo'?'journalHelpWork':topic==='casa'?'journalHelpHouse':topic==='relacion'?'journalHelpLove':'journalHelpOther';if(/(no s[eé] hacer nada|non so fare niente|non sono capace|soy un fracaso|sono un fallito|no sirvo)/i.test(lower))key='journalHelpSelf';helpText=[t('journalHelpCompassion'),t(key),trap==='ninguno'?t('journalHelpGeneric'):t('journalHelpTrap'),t('journalSource')].join('\n\n')}const output=document.getElementById('thought-help');if(output)output.textContent=helpText}
function addStepToTasks(entryId){const entry=state.journals.find(j=>j.id===entryId);if(!entry||!entry.next)return;const title=entry.next.slice(0,120);if(state.tasks.some(q=>!q.done&&q.title.toLocaleLowerCase()===title.toLocaleLowerCase())){showToast(t('journalTaskExists'));return}state.tasks.push({id:id(),title,category:entry.topic==='trabajo'?'trabajo':entry.topic==='casa'?'casa':'bienestar',priority:'media',next:'',due:'',done:false,created:today(),completedAt:'',custom:true});persist();render();showToast(t('journalAddedTask'))}
function freq(items,key){const map=new Map();for(const item of items){const v=item[key];if(v && v!=='ninguno' && v!=='otro')map.set(v,(map.get(v)||0)+1)}return [...map].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}

function journalPrior(topic){
 const previous=state.journals.filter(j=>j.topic===topic).slice().sort((a,b)=>(b.createdAt||b.date||'').localeCompare(a.createdAt||a.date||''))
 .filter(j=>j.learning||j.balanced||(j.reviews||[]).some(r=>r.useful)).slice(0,2);
 if(!previous.length)return `<p class="small muted">${esc(t('journalPreviousEmpty'))}</p>`;
 return previous.map(j=>{
 const helpful=[...(j.reviews||[])].reverse().find(r=>(r.help==='yes'||r.help==='part')&&r.useful);
 const quote=helpful?.useful||j.learning||j.balanced;
 return `<div class="journey-remember"><span class="tiny muted">${esc(dateStr(j.date))} · ${esc(jLabel('area',j.topic))}</span><p class="small">“${esc(quote).slice(0,240)}”</p></div>`;
 }).join('');
}

function showToast(msg){const old=document.querySelector('.toast');if(old)old.remove();const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=msg;document.body.append(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),3500)}

function updateBreath(){const circle=document.getElementById('breath-circle'),clock=document.getElementById('breath-time'),phase=document.getElementById('breath-phase'),button=document.getElementById('breath-button');if(!circle||!clock||!phase||!button)return;clock.textContent=String(breathLeft);const elapsed=60-breathLeft;phase.textContent=breathTimer?(elapsed%10<4?t('breathIn'):t('breathOut')):t('breathIdle');circle.classList.toggle('breathing',!!breathTimer);button.textContent=breathTimer?t('breathStop'):t('breathStart')}

function downloadBackup(){const content=JSON.stringify({...state,version:3},null,2);if(window.AndroidDiary?.exportJson){window.AndroidDiary.exportJson(content,`un-paso-a-la-vez-${today()}.json`);return;}const url=URL.createObjectURL(new Blob([content],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`un-paso-a-la-vez-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importBackup(file){if(!file)return;try{const val=JSON.parse(await file.text());if(!val||!Array.isArray(val.tasks)||!Array.isArray(val.moods)||!Array.isArray(val.thoughts)||(val.journals!==undefined&&!Array.isArray(val.journals))||val.tasks.length>20000||(val.journals||[]).length>10000)throw Error('bad');if(!confirm(t('importConfirm')))return;state={...defaultData(),...val};if(!['es','it'].includes(state.lang))state.lang='es';state.tasks=state.tasks.filter(q=>q && typeof q.id==='string'&&typeof q.title==='string').map(q=>({...q,title:q.title.slice(0,120),next:String(q.next||'').slice(0,350)}));state.wins=Array.isArray(state.wins)?state.wins:[];state.journals=Array.isArray(state.journals)?state.journals.filter(j=>j&&typeof j.id==='string'&&typeof j.date==='string').slice(0,10000).map(j=>({...j,reviews:safeReviews(j.reviews),...Object.fromEntries(journalFields.map(k=>[k,String(j[k]||'').slice(0,2500)])),topic:journalAreas.includes(j.topic)?j.topic:'otro',emotion:journalEmotions.includes(j.emotion)?j.emotion:'otro',trap:thinkingTraps.includes(j.trap)?j.trap:'ninguno',intensity:Math.min(5,Math.max(1,Number(j.intensity)||3))})):[];state.journalDraft={};state.today=state.today && Array.isArray(state.today.ids)?state.today:{date:today(),ids:[]};resetToday();persist();render();showToast(t('importDone'))}catch(err){showToast(t('importError'))}}
window.receiveAndroidBackup=function(contents){if(typeof contents!=='string'||contents.length>10000000){showToast(t('importError'));return;}importBackup(new File([contents],'backup.json',{type:'application/json'}));};
state.journals=state.journals.filter(j=>j&&typeof j.id==='string'&&typeof j.date==='string').map(j=>({...j,reviews:safeReviews(j.reviews)}));
const app=document.getElementById('app');
app.addEventListener('click',async e=>{if(e.target.hasAttribute('data-backdrop')){modal=null;render();return}const el=e.target.closest('[data-nav],[data-lang],[data-filter],[data-new],[data-edit],[data-delete],[data-today],[data-choose],[data-choose-task],[data-close],[data-mood],[data-connection],[data-copy],[data-breathe],[data-export],[data-import],[data-erase],[data-help-thought],[data-journal-edit],[data-journal-delete],[data-journal-cancel],[data-review-close],[data-pattern-window],[data-step-to-task],[data-followup],[data-followup-close],[data-clear-draft],[data-delete-review]');if(!el)return;
 if(el.dataset.deleteReview){const owner=state.journals.find(j=>j.id===el.dataset.reviewOwner);if(!owner||!Array.isArray(owner.reviews)||!owner.reviews.some(r=>r.id===el.dataset.deleteReview))return;if(!confirm(t('reviewDeleteConfirm')))return;owner.reviews=owner.reviews.filter(r=>r.id!==el.dataset.deleteReview);persist();render();showToast(t('reviewDeleted'));return}
 if(el.hasAttribute('data-followup-close')){followupId=null;render();return}
 if(el.dataset.followup){reviewEntry(el.dataset.followup);return}
 if(el.hasAttribute('data-clear-draft')){if(confirm(t('journalDraftConfirm'))){state.journalDraft={};journalEditId=null;persist();render()}return}
 if(el.hasAttribute('data-help-thought')){helpThought();return}
 if(el.dataset.journalEdit){journalEditId=el.dataset.journalEdit;reviewId=null;helpText='';page='journal';render();document.querySelector('.journal-editor')?.scrollIntoView({behavior:'smooth'});return}
 if(el.dataset.journalDelete){if(confirm(t('journalDeleteConfirm'))){state.journals=state.journals.filter(j=>j.id!==el.dataset.journalDelete);if(journalEditId===el.dataset.journalDelete)journalEditId=null;if(reviewId===el.dataset.journalDelete)reviewId=null;persist();render();showToast(t('journalDeleted'))}return}
 if(el.hasAttribute('data-journal-cancel')){journalEditId=null;helpText='';render();return}
 if(el.hasAttribute('data-review-close')){reviewId=null;render();return}
 if(el.dataset.patternWindow){patternWindow=Number(el.dataset.patternWindow);render();return}
 if(el.dataset.stepToTask){addStepToTasks(el.dataset.stepToTask);return}
 if(el.dataset.nav){navigate(el.dataset.nav);return}if(el.dataset.lang){state.lang=el.dataset.lang;persist();render();return}if(el.dataset.filter){filter=el.dataset.filter;render();return}if(el.hasAttribute('data-new')){modal='new';render();document.getElementById('taskName')?.focus();return}if(el.dataset.edit){modal=el.dataset.edit;render();document.getElementById('taskName')?.focus();return}if(el.dataset.delete){if(confirm(t('confirmDelete'))){state.tasks=state.tasks.filter(q=>q.id!==el.dataset.delete);state.today.ids=state.today.ids.filter(x=>x!==el.dataset.delete);persist();render();showToast(t('taskDeleted'))}return}if(el.dataset.today){toggleToday(el.dataset.today);return}if(el.hasAttribute('data-choose')){modal='choose';render();return}if(el.dataset.chooseTask){toggleToday(el.dataset.chooseTask);return}if(el.hasAttribute('data-close')){modal=null;render();return}if(el.dataset.mood){moodChoice=Number(el.dataset.mood);const note=document.getElementById('moodNote')?.value||'';render();if(document.getElementById('moodNote'))document.getElementById('moodNote').value=note;return}if(el.dataset.connection){connection=el.dataset.connection;state.connection=connection;const message=document.getElementById('personalMessage')?.value||'';state.message=message;persist();render();return}if(el.hasAttribute('data-copy')){const personal=(document.getElementById('personalMessage')?.value||'').trim();const msg=connectionMessages()[connection]+(personal?'\n\n'+personal:'');try{await navigator.clipboard.writeText(msg);showToast(t('copied'))}catch(e){const ta=document.createElement('textarea');ta.value=msg;document.body.append(ta);ta.select();try{document.execCommand('copy');showToast(t('copied'))}catch(_){}ta.remove()}return}if(el.hasAttribute('data-breathe')){toggleBreath();return}if(el.hasAttribute('data-export')){downloadBackup();return}if(el.hasAttribute('data-import')){if(window.AndroidDiary?.chooseBackup){window.AndroidDiary.chooseBackup()}else{document.getElementById('importFile').click()}return}if(el.hasAttribute('data-erase')){if(confirm(t('eraseConfirm'))){state=defaultData();connection='listen';moodChoice=0;journalEditId=null;reviewId=null;page='home';filter='all';modal=null;persist();render();showToast(t('eraseDone'))}return}
});
app.addEventListener('change',e=>{if(e.target.matches('[data-complete]')){toggleDone(e.target.dataset.complete,e.target.checked);return}if(e.target.id==='importFile'){importBackup(e.target.files?.[0]);return}if(e.target.id==='journal-topic-filter'){journalFilter=e.target.value;render();return}if(e.target.id==='j-topic'){const panel=document.getElementById('journal-prior');if(panel)panel.innerHTML=journalPrior(e.target.value)}});
app.addEventListener('input',e=>{if(e.target.id==='personalMessage'){state.message=e.target.value;persist()}if(e.target.id==='j-intensity'){document.getElementById('j-intensity-value').textContent=e.target.value}if(e.target.closest('#journal-form')){saveJournalDraft(e.target.closest('#journal-form'));const el=document.getElementById('draft-indicator');if(el)el.textContent=t('journalDraftSaved')}});
app.addEventListener('submit',e=>{if(['task-form','mood-form','thought-form','journal-form','review-save-form'].includes(e.target.id)){e.preventDefault();if(e.target.id==='task-form')saveTask(e.target);if(e.target.id==='mood-form')saveMood(e.target);if(e.target.id==='thought-form')saveThought(e.target);if(e.target.id==='journal-form')saveJournal(e.target);if(e.target.id==='review-save-form')saveFollowup(e.target)}});
window.nativeBack=function(){if(modal){modal=null;render();return true;}if(reviewId){reviewId=null;render();return true;}if(page!=='home'){navigate('home');return true;}return false;};
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});
render();
if(!window.UNPASO_NATIVE && 'serviceWorker' in navigator && ['https:','http:'].includes(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
